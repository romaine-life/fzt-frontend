services:
  fzt-frontend:
    # The release is built and tested by .forgejo/workflows/ci.yml; no mutable tag.
    image: forgejo.romaine.life/romaine-life/fzt-frontend:v0.1.49
    container_name: fzt-frontend
    environment:
      PORT: "3000"
      STORE_REPO: ssh://git@forgejo.romaine.life:2222/romaine-life/at.git
      STORE_DIR: /tmp/at-store
      STORE_DEPLOY_KEY_FILE: /run/secrets/store-deploy-key
    volumes:
      - ./credentials/store-deploy-key:/run/secrets/store-deploy-key:ro
    ports:
      - "127.0.0.1:3020:3000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:uid=1001,gid=1001,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
