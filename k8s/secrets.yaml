# From OpenBao secret/services/fzt-frontend, where homesvc kept them on the NAS.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: store-deploy-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: store-deploy-key
  data:
    - secretKey: store-deploy-key
      remoteRef:
        key: services/fzt-frontend
        property: store-deploy-key
---
# Read-only pull access to this Forgejo's registry.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-registry
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: forgejo-registry
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"forgejo.romaine.life":{"username":"nelson","password":"{{ .token }}"}}}'
  data:
    - secretKey: token
      remoteRef:
        key: services/fzt-frontend
        property: registry-read-token
