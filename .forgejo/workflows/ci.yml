name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      manifests: ${{ steps.diff.outputs.manifests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: romaine-life/pipeline-templates/actions/check-fetches@main
      # It scans every file, documentation included, so it runs on every change.
      - run: node scripts/check-no-hs256.mjs
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            echo manifests=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE...HEAD")
          if grep -qvE '\.md$|^docs/|^LICENSE$' <<< "$files"; then
            echo code=true >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^k8s/|^\.forgejo/workflows/ci\.yml$' <<< "$files"; then
            echo manifests=true >> "$GITHUB_OUTPUT"
          fi
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: go vet ./...
      - run: go test ./...
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    enable-openid-connect: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The image pin is pushed with PIPELINE_DISPATCH_TOKEN, as auth's is.
          persist-credentials: false
      - name: Check release inputs
        id: inputs
        # Against the last release, not the previous push, so a release that failed is
        # made by the next push to main.
        run: |
          set -eu
          last=$(git tag -l 'v0.1.*' --sort=-v:refname | head -1)
          if [ -z "$last" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$last" HEAD -- Dockerfile .dockerignore backend '*.go' go.mod go.sum; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build application image
        run: docker build --network host -t "fzt-frontend:check-$GITHUB_SHA" .
      - name: Smoke-test the real image and authentication gate
        run: |
          name="fzt-smoke-$GITHUB_RUN_ID"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --network host --name "$name" \
            -e PORT=33099 -e STORE_REPO=/tmp/seed -e STORE_DIR=/tmp/store \
            --entrypoint sh "fzt-frontend:check-$GITHUB_SHA" -c '
              set -eu
              git init -q -b main /tmp/seed
              echo fixture > /tmp/seed/README
              git -C /tmp/seed add README
              git -C /tmp/seed -c user.name=fixture -c user.email=fixture@example.com commit -qm fixture
              exec node backend/server.js'
          ready=false
          for n in $(seq 1 45); do
            if docker exec "$name" node -e 'fetch("http://127.0.0.1:33099/health").then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))'; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then docker logs "$name"; exit 1; fi
          docker exec "$name" node -e 'Promise.all([fetch("http://127.0.0.1:33099/fzt/tree/fixture"),fetch("http://127.0.0.1:33099/fzt/tree/fixture",{headers:{Authorization:"Bearer invalid"}})]).then(rs=>process.exit(rs.every(r=>r.status===401)?0:1))'
      - name: Publish image and module release on Forgejo
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.inputs.outputs.changed == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last=$(git tag -l 'v0.1.*' --sort=-v:refname | head -1)
          tag="v0.1.$(( ${last#v0.1.} + 1 ))"
          image="forgejo.romaine.life/romaine-life/fzt-frontend:$tag"
          export DOCKER_CONFIG="$RUNNER_TEMP/fzt-registry"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          set -euo pipefail
          # A refusal is printed (never an answer, which holds a token), and OpenBao's with
          # the claims it checks, so a refused sign-in says why.
          jwt=
          call() {
            out=$(curl -sS -w '\n%{http_code}' "$@")
            code=${out##*$'\n'}; body=${out%$'\n'*}
            if [ "$code" != 200 ]; then
              echo "Answered $code:$(printf '%s' "$body" | jq -c '.errors // .message // .' 2>/dev/null || printf '%s' "$body")" >&2
              [ -z "$jwt" ] || printf '%s' "$jwt" | cut -d. -f2 | tr '_-' '/+' | jq -R '@base64d | fromjson | {sub, repository, ref, workflow, event_name, aud}' >&2 || true
              return 1
            fi
            printf '%s' "$body"
          }
          jwt=$(printf 'header = "Authorization: bearer %s"\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" | call -K - "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=openbao" | jq -er .value)
          echo "::add-mask::$jwt"
          bao=$(printf '%s' "$jwt" | jq -Rs '{role:"fzt-frontend-publish",jwt:.}' | call -H 'Content-Type: application/json' --data-binary @- https://bao.home.romaine.life/v1/auth/forgejo/login | jq -er .auth.client_token)
          echo "::add-mask::$bao"
          registry=$(printf 'header = "X-Vault-Token: %s"\n' "$bao" | call -K - https://bao.home.romaine.life/v1/secret/data/services/fzt-frontend-build | jq -er '.data.data["registry-token"]')
          echo "::add-mask::$registry"
          printf '%s' "$registry" | docker login forgejo.romaine.life --username nelson --password-stdin
          docker tag "fzt-frontend:check-$GITHUB_SHA" "$image"
          # The pin names the digest the registry holds for the tag.
          digest=$(docker push "$image" | tee /dev/stderr | sed -n -E 's/^.*digest: (sha256:[0-9a-f]{64}) .*$/\1/p')
          test -n "$digest"
          body=$(jq -n --arg tag "$tag" --arg sha "$GITHUB_SHA" --arg image "$image" '{tag_name:$tag,target_commitish:$sha,name:$tag,body:("Built and smoke-tested on Forgejo. Container: `"+$image+"`.")}')
          printf 'header = "Authorization: token %s"\n' "$TOKEN" | curl -sS --fail-with-body -K - -H 'Content-Type: application/json' -X POST -d "$body" "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/releases"
          printf '%s\n' "IMAGE_TAG=$tag" "IMAGE_PIN=$tag@$digest" >> "$GITHUB_ENV"
      # The home cluster runs what k8s/ pins, so a release reaches it through this PR,
      # merged once its checks pass (auth's pattern, romaine-life/auth).
      - name: Propose the image pin
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.inputs.outputs.changed == 'true'
        env:
          TOKEN: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          branch="HOMEINFRA-1-image-$IMAGE_TAG"
          git checkout -b "$branch"
          sed -i -E "s|^(          image: forgejo.romaine.life/romaine-life/fzt-frontend:).*$|\1$IMAGE_PIN|" k8s/deployment.yaml
          git config user.name forgejo-actions
          git config user.email forgejo-actions@noreply.romaine.life
          git add k8s/deployment.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: pin fzt-frontend image $IMAGE_TAG"
          # Keep the credential out of git's process arguments.
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader
          export GIT_CONFIG_VALUE_0="Authorization: Basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git push origin "HEAD:refs/heads/$branch"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          body=$(jq -n --arg head "$branch" --arg tag "$IMAGE_TAG" '{base:"main",head:$head,title:("chore: pin fzt-frontend image "+$tag),body:"Validated image pin. https://openproject.romaine.life/wp/HOMEINFRA-1"}')
          pr=$(printf 'Authorization: token %s\n' "$TOKEN" | curl --fail-with-body -sS -X POST --header @- -H 'Content-Type: application/json' -d "$body" "$api/pulls")
          number=$(echo "$pr" | jq -r .number)
          printf 'Authorization: token %s\n' "$TOKEN" | curl --fail-with-body -sS -X POST --header @- -H 'Content-Type: application/json' -d '{"Do":"squash","merge_when_checks_succeed":true,"delete_branch_after_merge":true}' "$api/pulls/$number/merge"
  manifests:
    needs: changes
    if: needs.changes.outputs.manifests == 'true'
    runs-on: linux
    steps:
      - uses: actions/checkout@v4
      - name: Check the home cluster's manifests
        run: |
          set -euo pipefail
          curl -fsSL https://artifacts.home.romaine.life/general/github/kubernetes-sigs/kustomize/releases/download/kustomize/v5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz | tar xz -C /usr/local/bin kustomize
          curl -fsSL https://artifacts.home.romaine.life/general/github/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
          kustomize build k8s > "$RUNNER_TEMP/manifests.yaml"
          kubeconform -strict -summary -schema-location 'https://artifacts.home.romaine.life/general/githubusercontent/yannh/kubernetes-json-schema/master/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json' \
            -schema-location 'https://artifacts.home.romaine.life/general/githubusercontent/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "$RUNNER_TEMP/manifests.yaml"
      - uses: romaine-life/pipeline-templates/actions/check-image-digests@main
        with:
          manifests: ${{ runner.temp }}/manifests.yaml
