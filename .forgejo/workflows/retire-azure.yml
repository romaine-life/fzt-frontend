name: Retired Azure configuration
on:
  pull_request:
    paths: [infra/**, .forgejo/workflows/retire-azure.yml]
  push:
    branches: [main]
    paths: [infra/**, .forgejo/workflows/retire-azure.yml]
jobs:
  validate:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: romaine-life/pipeline-templates/actions/home-cache@main
      - uses: romaine-life/pipeline-templates/actions/setup-opentofu@main
        with:
          tofu-version: '1.12.0'
      - run: tofu -chdir=infra fmt -check
      - run: tofu -chdir=infra init -backend=false
      - run: tofu -chdir=infra validate
